name: Frontend CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Code auschecken
        uses: actions/checkout@v4

      - name: Node.js 20 einrichten
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Dependencies installieren
        run: npm ci

      - name: Typescript prüfen
        run: npx tsc --noEmit

      - name: Linter ausführen
        run: npm run lint

      - name: Tests ausführen
        run: npx vitest run

      - name: Build prüfen
        run: npm run build
